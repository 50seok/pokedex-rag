<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pokemon.nameKo} + ' - 관동 도감'"></title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container detail">
    <!-- ponytail: 관동(1세대) 151종 고정 스코프라 마지막 번호를 하드코딩. 세대 확장 시 전체 개수 조회로 전환 -->
    <div class="detail-nav">
        <a th:if="${pokemon.id > 1}" th:href="@{/pokemon/{id}(id=${pokemon.id - 1})}" class="detail-nav-btn">◀ 이전</a>
        <a th:if="${pokemon.id < 151}" th:href="@{/pokemon/{id}(id=${pokemon.id + 1})}" class="detail-nav-btn detail-nav-btn-next">다음 ▶</a>
    </div>
    <div class="detail-sprites">
        <img class="detail-sprite" th:src="${pokemon.spriteUrl}" th:alt="${pokemon.nameKo}">
        <img class="detail-sprite-animated"
             th:src="${'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/' + pokemon.id + '.gif'}"
             th:alt="${pokemon.nameKo} + ' 움직이는 모습'" loading="lazy">
    </div>
    <button type="button" id="cry-btn" class="cry-btn"
            th:attr="data-cry-url=${'https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/' + pokemon.id + '.ogg'}">
        🔊 울음소리 듣기
    </button>
    <audio id="cry-audio" preload="none"></audio>
    <span class="dex-no dex-no-detail" th:text="'#' + ${#numbers.formatInteger(pokemon.id, 3)}"></span>
    <h1 th:text="${pokemon.nameKo}"></h1>
    <p class="genus" th:text="${pokemon.genusKo}"></p>
    <div class="type-chips">
        <span class="type-chip" th:each="t : ${pokemon.types}" th:class="'type-chip type-' + ${t}"
              th:text="${T(com.pokedexrag.util.TypeLabels).labelOf(t)}"></span>
    </div>

    <th:block th:with="weaknesses=${T(com.pokedexrag.util.TypeEffectiveness).weaknessesOf(pokemon.types)}">
        <div class="weakness-row" th:if="${not #lists.isEmpty(weaknesses)}">
            <span class="weakness-label">약점</span>
            <span class="type-chip" th:each="w : ${weaknesses}" th:class="'type-chip type-' + ${w}"
                  th:text="${T(com.pokedexrag.util.TypeLabels).labelOf(w)}"></span>
        </div>
    </th:block>

    <dl class="info-list"
        th:if="${(pokemon.abilities != null and not #lists.isEmpty(pokemon.abilities)) or pokemon.habitatKo != null or pokemon.colorKo != null}">
        <th:block th:if="${pokemon.abilities != null and not #lists.isEmpty(pokemon.abilities)}">
            <dt>특성</dt>
            <dd th:text="${#strings.listJoin(pokemon.abilities, ', ')}"></dd>
        </th:block>
        <th:block th:if="${pokemon.habitatKo != null}">
            <dt>서식지</dt>
            <dd th:text="${pokemon.habitatKo}"></dd>
        </th:block>
        <th:block th:if="${pokemon.colorKo != null}">
            <dt>색상</dt>
            <dd th:text="${pokemon.colorKo}"></dd>
        </th:block>
    </dl>

    <div class="evolution-row" th:if="${evolution.evolvesFromName != null or not #lists.isEmpty(evolution.evolvesTo)}">
        <h2 class="section-title">진화</h2>
        <div class="evolution-chips">
            <a th:if="${evolution.evolvesFromName != null}" class="evolution-chip"
               th:href="@{/pokemon/{id}(id=${pokemon.evolvesFromId})}" th:text="${evolution.evolvesFromName}"></a>
            <a th:each="target : ${evolution.evolvesTo}" class="evolution-chip"
               th:href="@{/pokemon/{id}(id=${target.id})}"
               th:text="${target.nameKo} + (${#strings.isEmpty(target.condition)} ? '' : ' (' + ${target.condition} + ')')"></a>
        </div>
    </div>

    <!-- ponytail: 막대 폭은 기준치 200(관동 151종 범위에서 충분한 상한) 대비 비율, 200 넘는 값은 100%로 클램프 -->
    <div class="stat-rows">
        <div class="stat-row">
            <span class="stat-label">HP</span>
            <div class="stat-bar-track"><div class="stat-bar-fill" th:class="'stat-bar-fill bar-' + ${pokemon.types[0]}" th:style="'width:' + (${pokemon.hp} >= 200 ? 100 : ${pokemon.hp} / 2) + '%'"></div></div>
            <span class="stat-value" th:text="${pokemon.hp}"></span>
        </div>
        <div class="stat-row">
            <span class="stat-label">공격</span>
            <div class="stat-bar-track"><div class="stat-bar-fill" th:class="'stat-bar-fill bar-' + ${pokemon.types[0]}" th:style="'width:' + (${pokemon.attack} >= 200 ? 100 : ${pokemon.attack} / 2) + '%'"></div></div>
            <span class="stat-value" th:text="${pokemon.attack}"></span>
        </div>
        <div class="stat-row">
            <span class="stat-label">방어</span>
            <div class="stat-bar-track"><div class="stat-bar-fill" th:class="'stat-bar-fill bar-' + ${pokemon.types[0]}" th:style="'width:' + (${pokemon.defense} >= 200 ? 100 : ${pokemon.defense} / 2) + '%'"></div></div>
            <span class="stat-value" th:text="${pokemon.defense}"></span>
        </div>
        <div class="stat-row">
            <span class="stat-label">특수공격</span>
            <div class="stat-bar-track"><div class="stat-bar-fill" th:class="'stat-bar-fill bar-' + ${pokemon.types[0]}" th:style="'width:' + (${pokemon.specialAttack} >= 200 ? 100 : ${pokemon.specialAttack} / 2) + '%'"></div></div>
            <span class="stat-value" th:text="${pokemon.specialAttack}"></span>
        </div>
        <div class="stat-row">
            <span class="stat-label">특수방어</span>
            <div class="stat-bar-track"><div class="stat-bar-fill" th:class="'stat-bar-fill bar-' + ${pokemon.types[0]}" th:style="'width:' + (${pokemon.specialDefense} >= 200 ? 100 : ${pokemon.specialDefense} / 2) + '%'"></div></div>
            <span class="stat-value" th:text="${pokemon.specialDefense}"></span>
        </div>
        <div class="stat-row">
            <span class="stat-label">스피드</span>
            <div class="stat-bar-track"><div class="stat-bar-fill" th:class="'stat-bar-fill bar-' + ${pokemon.types[0]}" th:style="'width:' + (${pokemon.speed} >= 200 ? 100 : ${pokemon.speed} / 2) + '%'"></div></div>
            <span class="stat-value" th:text="${pokemon.speed}"></span>
        </div>
    </div>

    <p class="flavor-text" th:text="${pokemon.flavorTextKo}"></p>
</main>

<script>
    document.getElementById('cry-btn').addEventListener('click', function () {
        var audio = document.getElementById('cry-audio');
        audio.src = this.dataset.cryUrl;
        audio.volume = 0.5;
        audio.play();
    });
</script>
</body>
</html>
