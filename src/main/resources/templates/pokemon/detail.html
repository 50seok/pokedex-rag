<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pokemon.nameKo} + ' - 관동 도감'"></title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container detail">
    <div class="detail-sprites">
        <img class="detail-sprite" th:src="${pokemon.spriteUrl}" th:alt="${pokemon.nameKo}">
        <img class="detail-sprite-animated"
             th:src="${'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/' + pokemon.id + '.gif'}"
             th:alt="${pokemon.nameKo} + ' 움직이는 모습'" loading="lazy">
    </div>
    <button type="button" id="cry-btn" class="cry-btn"
            th:attr="data-cry-url=${'https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/' + pokemon.id + '.ogg'}">
        🔊 울음소리 듣기
    </button>
    <audio id="cry-audio" preload="none"></audio>
    <h1 th:text="${pokemon.nameKo}"></h1>
    <p class="genus" th:text="${pokemon.genusKo}"></p>
    <div class="type-chips">
        <span class="type-chip" th:each="t : ${pokemon.types}"
              th:text="${T(com.pokedexrag.util.TypeLabels).labelOf(t)}"></span>
    </div>

    <table class="stat-table">
        <tbody>
        <tr><th>HP</th><td th:text="${pokemon.hp}"></td></tr>
        <tr><th>공격</th><td th:text="${pokemon.attack}"></td></tr>
        <tr><th>방어</th><td th:text="${pokemon.defense}"></td></tr>
        <tr><th>특수공격</th><td th:text="${pokemon.specialAttack}"></td></tr>
        <tr><th>특수방어</th><td th:text="${pokemon.specialDefense}"></td></tr>
        <tr><th>스피드</th><td th:text="${pokemon.speed}"></td></tr>
        </tbody>
    </table>

    <p class="flavor-text" th:text="${pokemon.flavorTextKo}"></p>
</main>

<script>
    document.getElementById('cry-btn').addEventListener('click', function () {
        var audio = document.getElementById('cry-audio');
        audio.src = this.dataset.cryUrl;
        audio.play();
    });
</script>
</body>
</html>
